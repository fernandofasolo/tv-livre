name: Build launcher

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build .ipk (pure-Python packager)
        run: python launcher/scripts/build.py
      - name: Checksums
        run: cd launcher/dist && sha256sum *.ipk | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: tvlivre-ipk
          path: launcher/dist/
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            launcher/dist/*.ipk
            launcher/dist/SHA256SUMS
